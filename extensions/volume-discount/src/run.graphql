query RunInput {
  discountNode {
    metafield(namespace: "volume_discount", key: "config") {
      jsonValue
    }
  }
  cart {
    lines {
      id
      quantity
      cost {
        totalAmount {
          amount
        }
      }
      bundleItem: attribute(key: "_bundle_item") {
        value
      }
      quizBundleId: attribute(key: "_quiz_bundle_id") {
        value
      }
      nektarGlp1: attribute(key: "_nektar_glp1") {
        value
      }
      merchandise {
        ... on ProductVariant {
          __typename
          product {
            id
            metafield(namespace: "custom", key: "volume_discount_tiers") {
              jsonValue
            }
          }
        }
      }
    }
  }
}
